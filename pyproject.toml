[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongke-workbench"
version = "0.1.0"
description = "工科工作台：原生工程建模、机械校核与 agent 协作"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
geometry = ["build123d>=0.9"]
report = ["python-docx>=1.1", "pillow>=10.1"]
drawing = ["ezdxf>=1.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gongke_core*", "freecad*"]

[tool.setuptools.package-data]
gongke_core = ["resources/*.json"]
"freecad.gongke" = ["resources/icons/*.svg"]
