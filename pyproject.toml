[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongke-workbench"
version = "0.1.0"
description = "工科工作台：原生工程建模、机械校核与 agent 协作"
requires-python = ">=3.11"
license = "LGPL-2.1-or-later"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
geometry = ["build123d>=0.9"]
report = ["python-docx>=1.1", "pillow>=10.1"]
drawing = ["ezdxf>=1.3"]
dev = ["pytest>=8", "mcp>=2.3,<3"]
desktop = ["python-docx>=1.1", "pillow>=10.1", "ezdxf>=1.3", "build123d>=0.9", "pyinstaller>=6"]

[project.scripts]
gongke-service = "gongke_app.service:main"

[tool.setuptools.packages.find]
include = ["gongke_core*", "gongke_app*", "freecad*"]

[tool.setuptools.package-data]
gongke_core = ["resources/*.json"]
"freecad.gongke" = ["resources/icons/*.svg"]
