[project]
name = "gongke-workbench"
version = "0.1.0"
description = "工科工作台：面向机械类课程设计的设计计算、三维建模与计算说明书"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
geometry = ["build123d>=0.9"]
report = ["python-docx>=1.1", "pillow>=10.1"]
drawing = ["ezdxf>=1.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gongke_core*", "freecad*"]
