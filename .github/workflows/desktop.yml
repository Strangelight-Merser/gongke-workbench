name: Desktop and native adapter builds

on:
  push:
    paths:
      - desktop/**
      - gongke_app/**
      - gongke_core/**
      - freecad/**
      - adapters/**
      - packaging/**
      - tools/build_app_service.py
      - pyproject.toml
      - tests/test_app_service.py
      - tests/test_host_paths.py
      - tests/test_copy_receipt_recovery.py
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - gongke_app/**
      - gongke_core/**
      - freecad/**
      - adapters/**
      - packaging/**
      - tools/build_app_service.py
      - pyproject.toml
      - tests/test_app_service.py
      - tests/test_host_paths.py
      - tests/test_copy_receipt_recovery.py
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      GONGKE_PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install application dependencies
        run: python -m pip install ".[desktop]" pytest
      - name: Test application commands and agent protocol
        run: python -m pytest -q tests/test_app_service.py tests/test_host_paths.py tests/test_copy_receipt_recovery.py
      - name: Build and test desktop
        working-directory: desktop
        run: |
          npm ci
          npm run build
          npm test
      - name: Test recovery controls with a simulated native host
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npx playwright install chromium
          node tests/commercial-flow.cjs
      - name: Test SOLIDWORKS protocol without proprietary references
        run: dotnet run --project adapters/solidworks/tests/ProtocolChecks.csproj -c Release
      - name: Test AutoCAD transport and operation receipts
        run: dotnet run --project adapters/autocad/Gongke.AutoCAD.ContractTests/Gongke.AutoCAD.ContractTests.csproj -c Release
      - name: Compile AutoCAD adapters against Autodesk SDK references
        if: runner.os == 'Windows'
        run: python adapters/autocad/scripts/build.py --output out/autocad-ci
      - name: Parse native installation and diagnostic scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem adapters -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; $errors | ForEach-Object { Write-Error $_ -ErrorAction Continue } }
          }
          if ($failed) { exit 1 }
      - name: Build native platform application service
        run: python tools/build_app_service.py
      - name: Check frozen service from a clean directory
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          exe = root / 'desktop/service/gongke-service' / ('gongke-service.exe' if os.name == 'nt' else 'gongke-service')
          with tempfile.TemporaryDirectory(prefix='gongke-frozen-') as temp:
              workspace = pathlib.Path(temp)
              commands = [
                  {'id': 1, 'method': 'system.status', 'params': {}},
                  {'id': 2, 'method': 'project.create', 'params': {'path': str(workspace / 'project'), 'teaching': True}},
                  {'id': 3, 'method': 'design.calculate', 'params': {}},
              ]
              env = {key: value for key, value in os.environ.items() if key not in ('PYTHONPATH', 'PYTHONHOME')}
              result = subprocess.run([str(exe), '--state-dir', str(workspace / 'state')],
                  input=''.join(json.dumps(item) + '\n' for item in commands), cwd=workspace,
                  env=env, text=True, capture_output=True, timeout=90, check=True)
              replies = {item['id']: item for item in map(json.loads, result.stdout.splitlines()) if 'id' in item}
              assert all('error' not in replies[i] for i in (1, 2, 3)), replies
              assert replies[1]['result']['packaged'] is True
              assert replies[3]['result']['motor']['power_kw'] > 0
              assert (workspace / 'project/gongke-project.json').is_file()
          print('Frozen service starts and performs a real teaching calculation without the source checkout.')
      - name: Package unpacked desktop application
        working-directory: desktop
        run: npx electron-builder --dir --publish never
      - name: Verify macOS development bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict desktop/release/mac*/构想引擎.app
      - name: Exercise packaged desktop with a fresh user directory
        timeout-minutes: 8
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          product = json.loads((root / 'desktop/package.json').read_text(encoding='utf-8'))['build']['productName']
          release = root / 'desktop/release'
          pattern = '*-unpacked/' + product + '.exe' if os.name == 'nt' else 'mac*/' + product + '.app/Contents/MacOS/' + product
          executables = [path for path in release.glob(pattern) if path.is_file()]
          assert len(executables) == 1, f'Expected one packaged executable, found {executables}'
          env = dict(os.environ, GONGKE_TEST_EXECUTABLE=str(executables[0].resolve()))
          for key in ('PYTHONPATH', 'PYTHONHOME', 'ELECTRON_RUN_AS_NODE'):
              env.pop(key, None)
          subprocess.run(['node', str(root / 'desktop/tests/desktop-flow.cjs')], cwd=root,
              env=env, timeout=420, check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-desktop-validation-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            out/desktop-validation/**/*.json
            out/desktop-validation/**/*.png
            out/desktop-validation/**/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Archive application preserving executable permissions and symlinks
        shell: python
        run: |
          import os, pathlib, tarfile
          release = pathlib.Path('desktop/release')
          folders = [path for path in release.iterdir() if path.is_dir() and
                     (path.name.endswith('-unpacked') or path.name.startswith('mac'))]
          assert folders, 'electron-builder produced no unpacked application'
          archive = release / ('gongke-desktop-' + os.environ['RUNNER_OS'] + '-' + os.environ['RUNNER_ARCH'] + '.tar.gz')
          with tarfile.open(archive, 'w:gz', dereference=False) as output:
              for folder in folders:
                  output.add(folder, arcname=folder.name)
      - uses: actions/upload-artifact@v4
        with:
          name: gongke-desktop-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: desktop/release/gongke-desktop-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: autocad-sdk-compiled-${{ github.sha }}
          path: out/autocad-ci/**
          if-no-files-found: error
          retention-days: 7
      - name: Record validation boundary
        shell: bash
        run: |
          echo 'Desktop packaging, deterministic calculation, protocol checks, and SDK compilation only. No SOLIDWORKS/AutoCAD host, license, drawing, installer, or mechanical acceptance was exercised.' >> "$GITHUB_STEP_SUMMARY"
