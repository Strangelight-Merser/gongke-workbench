name: 测试

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y calculix-ccx gmsh  # 有限元复核的测试需要 ccx ≥ 2.21 和 gmsh
      - run: pip install pyyaml pytest python-docx pillow build123d ezdxf
      - run: pytest -q

  freecad-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2
      - run: tests/e2e/run_freecad_e2e.sh
